<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EC">
  <title>Classical Mind</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ============================================================
       One-page topic template. Everything about a School or an Art
       on a single scrolling page — but broken into drop-down
       sections so it reads as a set of small, separate, tappable
       pieces rather than one long passage. You land on the gist,
       the at-a-glance strip and the core ideas (open); everything
       below is collapsed, each with its own look and a count that
       invites the tap. Colour is a soft accent on a warm light
       ground, never a heavy slab. Family gradient-outline kept.
       ============================================================ */
    .op-main{ max-width:680px; margin:0 auto; padding:0 16px 72px; }
    .op-outline{ position:relative; }
    .op-outline::before{ content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
      background:linear-gradient(135deg,var(--m-color),var(--m-deep)); opacity:.5;
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }

    /* Hero — a cover image with the title resting on it, magazine-style */
    .op-hero{ position:relative; border-radius:22px; overflow:hidden; margin:12px 0 0; min-height:230px;
      display:flex; flex-direction:column; justify-content:flex-end;
      background:linear-gradient(150deg,var(--m-color),var(--m-deep));
      box-shadow:0 4px 10px rgba(60,45,20,.10),0 16px 38px rgba(60,45,20,.16); }
    .op-hero-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .op-hero::after{ content:""; position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(15,10,5,.14) 55%,rgba(15,10,5,.68) 100%); }
    .op-hero-txt{ position:relative; z-index:2; padding:20px 22px 20px; }
    .op-eyebrow{ font:800 .7rem/1 -apple-system,system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase; color:#fff; opacity:.92;
      text-shadow:0 1px 6px rgba(0,0,0,.5); }
    .op-hero h1{ margin:.32em 0 0; font-weight:800; font-size:clamp(30px,8vw,42px); letter-spacing:-.035em; line-height:1; color:#fff;
      text-shadow:0 2px 12px rgba(0,0,0,.5); }
    .op-hero .op-tagline{ margin:.5em 0 0; font-weight:700; font-size:1.02em; color:#fff; opacity:.95; text-shadow:0 1px 8px rgba(0,0,0,.5); }

    /* The gist — the first thing you read, sets the whole picture */
    .op-gist{ font-size:1.09em; line-height:1.62; color:var(--ink,#2A2038); margin:20px 2px 0; }
    .op-gist::first-letter{ font-weight:800; }

    /* At a glance — scannable chips: when, where, who, the one idea */
    .op-glance{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0 4px; }
    .op-glance.one{ grid-template-columns:1fr; }
    .op-gcard{ background:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 2px 4px rgba(60,45,20,.05),0 7px 18px rgba(60,45,20,.06); }
    .op-gcard.wide{ grid-column:1 / -1; }
    .op-gk{ font:800 .64rem/1 -apple-system,system-ui,sans-serif; letter-spacing:.11em; text-transform:uppercase; color:var(--m-deep,#2F4550); opacity:.8; }
    .op-gv{ margin-top:.4em; font-size:.98em; line-height:1.4; font-weight:600; color:var(--ink,#2A2038); }

    /* ---- Section drop-downs — the backbone of the page ---- */
    .op-drop{ background:#fff; border-radius:18px; margin:14px 0 0; overflow:hidden;
      box-shadow:0 2px 4px rgba(60,45,20,.05),0 9px 22px rgba(60,45,20,.07); }
    .op-drop > summary{ list-style:none; cursor:pointer; padding:17px 18px; display:flex; align-items:center; gap:13px; -webkit-tap-highlight-color:transparent; }
    .op-drop > summary::-webkit-details-marker{ display:none; }
    .op-sum-tt{ flex:1; min-width:0; display:flex; flex-direction:column; }
    .op-sum-title{ display:flex; align-items:center; gap:.55em; font-weight:800; font-size:1.12em; letter-spacing:-.015em; color:var(--ink,#2A2038); line-height:1.2; }
    .op-sum-title::before{ content:""; flex:none; width:9px; height:9px; border-radius:3px; background:linear-gradient(150deg,var(--m-color),var(--m-deep)); }
    .op-count{ font:800 .62rem/1 -apple-system,system-ui,sans-serif; letter-spacing:.03em; text-transform:uppercase;
      color:var(--m-deep,#2F4550); background:var(--m-soft,#E3ECF0); padding:.42em .62em; border-radius:999px; }
    .op-sub{ font-weight:600; font-size:.83em; color:var(--ink-mute,#7a7488); margin-top:.28em; letter-spacing:0; }
    .op-chev{ margin-left:auto; flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
      color:var(--m-deep,#2F4550); background:var(--m-soft,#E3ECF0); font-weight:800; transition:transform .22s ease; }
    .op-drop[open] > summary .op-chev{ transform:rotate(90deg); }
    .op-drop-body{ padding:0 18px 18px; }
    .op-drop-body .op-intro{ margin:0 0 15px; }

    /* An intro line for a section */
    .op-intro{ font-size:1em; line-height:1.55; color:var(--ink-mute,#7a7488); }

    /* Core ideas — read them (open section). Numbered, with a why highlight */
    .op-idea{ background:var(--paper,#FAF6EC); border-radius:15px; padding:15px 16px 14px; margin:0 0 11px; }
    .op-idea:last-child{ margin-bottom:0; }
    .op-idea-top{ display:flex; align-items:baseline; gap:11px; }
    .op-idx{ flex:none; width:27px; height:27px; border-radius:9px; display:grid; place-items:center; transform:translateY(2px);
      font:800 .9em -apple-system,system-ui,sans-serif; color:#fff; background:linear-gradient(150deg,var(--m-color),var(--m-deep)); }
    .op-idea h3{ margin:0; font-weight:800; font-size:1.1em; letter-spacing:-.015em; line-height:1.24; color:var(--ink,#2A2038); }
    .op-idea p{ margin:.5em 0 0; font-size:.99em; line-height:1.56; color:var(--ink-soft,#4d4658); }
    .op-why{ margin:.7em 0 0; padding:.7em .9em; border-radius:11px; background:#fff; box-shadow:0 1px 3px rgba(60,45,20,.06);
      font-size:.93em; line-height:1.5; color:var(--ink-soft,#3f3a4c); }
    .op-why b{ font:800 .64rem/1 -apple-system,system-ui,sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--m-deep,#2F4550); display:block; margin-bottom:.35em; }

    /* Remember it by — visible highlight that breaks the page in half */
    .op-remember{ position:relative; border-radius:18px; padding:18px 20px 18px 22px; margin:22px 0 6px; overflow:hidden;
      background:linear-gradient(155deg,var(--m-soft,#E3ECF0),#FFFDF9); box-shadow:0 2px 4px rgba(60,45,20,.05),0 9px 22px rgba(60,45,20,.06); }
    .op-remember::after{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--m-color),var(--m-deep)); }
    .op-remember .op-rk{ font:800 .68rem/1 -apple-system,system-ui,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--m-deep,#2F4550); }
    .op-remember p{ margin:.5em 0 0; font-size:1.05em; line-height:1.55; color:var(--ink,#2A2038); }
    .op-remember p + p{ margin-top:.55em; font-size:.98em; color:var(--ink-soft,#4d4658); }
    .op-remember b{ color:var(--m-deep,#2F4550); }

    /* Key figures — compact people rows, ready to take a portrait later */
    .op-fig{ display:flex; gap:13px; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--rule,#EADFC6); }
    .op-fig:first-child{ padding-top:2px; }
    .op-fig:last-child{ border-bottom:0; padding-bottom:2px; }
    .op-fig-av{ flex:none; width:46px; height:46px; border-radius:13px; overflow:hidden; display:grid; place-items:center;
      font:800 1em Georgia,serif; color:#fff; background:linear-gradient(140deg,var(--m-color),var(--m-deep)); }
    .op-fig-av img{ width:100%; height:100%; object-fit:cover; }
    .op-fig-tt{ min-width:0; }
    .op-fig-name{ font-weight:800; font-size:1.01em; letter-spacing:-.01em; line-height:1.25; color:var(--ink,#2A2038); }
    .op-fig-what{ margin-top:.25em; font-size:.93em; line-height:1.5; color:var(--ink-soft,#4d4658); }

    /* Path stages — bullets, a change of texture from the cards */
    .op-stage{ margin:0 0 16px; }
    .op-stage:last-child{ margin-bottom:0; }
    .op-stage h4{ margin:0 0 .55em; font-weight:800; font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--m-deep,#2F4550); }
    .op-stage ul{ margin:0; padding-left:1.1em; list-style:none; }
    .op-stage li{ position:relative; font-size:.97em; line-height:1.55; color:var(--ink-soft,#4d4658); margin:0 0 .5em; padding-left:.2em; }
    .op-stage li::before{ content:""; position:absolute; left:-.85em; top:.62em; width:6px; height:6px; border-radius:50%; background:var(--m-color); }

    /* Practice items — name + body list with dividers */
    .op-prac{ padding:12px 0; border-bottom:1px solid var(--rule,#EADFC6); }
    .op-prac:first-child{ padding-top:2px; }
    .op-prac:last-child{ border-bottom:0; padding-bottom:2px; }
    .op-prac-name{ font-weight:800; font-size:1.01em; color:var(--ink,#2A2038); }
    .op-prac-body{ margin-top:.28em; font-size:.95em; line-height:1.55; color:var(--ink-soft,#4d4658); }

    /* FAQ — smaller nested accordions, a different rhythm again */
    .op-faq{ margin-top:11px; border-radius:14px; }
    .op-faq > summary{ padding:14px 16px; }
    .op-faq .op-sum-title{ font-size:1.02em; }
    .op-faq .op-sum-title::before{ display:none; }

    /* Reading — primary sources first, with a coloured tag */
    .op-book{ padding:14px 0; border-bottom:1px solid var(--rule,#EADFC6); }
    .op-book:first-child{ padding-top:2px; }
    .op-book:last-child{ border-bottom:0; padding-bottom:2px; }
    .op-book-title{ font-weight:800; font-size:1.03em; letter-spacing:-.01em; line-height:1.25; color:var(--ink,#2A2038); }
    .op-book-author{ margin-top:.15em; font-size:.9em; font-weight:600; color:var(--ink-mute,#7a7488); }
    .op-book-note{ margin:.5em 0 0; font-size:.93em; line-height:1.55; color:var(--ink-soft,#4d4658); }
    .op-tag{ display:inline-block; font:800 .58rem/1 -apple-system,system-ui,sans-serif; letter-spacing:.07em; text-transform:uppercase;
      padding:.35em .6em; border-radius:999px; margin-right:.5em; vertical-align:.08em; }
    .op-tag.primary{ color:#fff; background:linear-gradient(135deg,var(--m-color),var(--m-deep)); }
    .op-tag.onramp{ color:var(--m-deep,#2F4550); background:var(--m-soft,#E3ECF0); }

    /* Section label (used above the FAQ group) */
    .op-label{ font:800 .8rem/1.1 -apple-system,system-ui,sans-serif; letter-spacing:.05em; text-transform:uppercase;
      color:var(--m-deep,#2F4550); margin:30px 0 4px; display:flex; align-items:center; gap:.7em; }
    .op-label::after{ content:""; flex:1; height:2px; border-radius:2px; background:linear-gradient(90deg,color-mix(in srgb, var(--m-color) 50%, transparent),transparent); }

    /* Read aloud + back */
    .op-actions{ display:flex; align-items:center; gap:12px; margin:30px 0 0; flex-wrap:wrap; }
    .op-read{ display:inline-flex; align-items:center; gap:.5em; cursor:pointer; font:800 .96em -apple-system,system-ui,sans-serif;
      color:var(--m-deep,#2F4550); background:#fff; border:1.7px solid currentColor; padding:.62em 1.2em; border-radius:999px; box-shadow:0 2px 5px rgba(60,45,20,.08); }
    .op-back{ font:700 .92em -apple-system,system-ui,sans-serif; color:var(--ink-mute,#7a7488); text-decoration:none; }

    /* The bigger picture — a philosophy's own cosmos/worldview, in its own voice */
    .op-world p{ font-size:1.01em; line-height:1.64; color:var(--ink-soft,#4d4658); margin:0 0 .85em; }
    .op-world p:first-child{ margin-top:2px; }
    .op-world p:last-child{ margin-bottom:0; }
    .op-world p:first-child::first-letter{ font-weight:800; font-size:1.15em; color:var(--m-deep,#2F4550); }

    /* Interactive "test yourself" (reuses tryit data) */
    .tryit-q{ font-weight:700; color:var(--ink); font-size:1.02em; line-height:1.4; margin-bottom:12px; }
    .tryit-opts{ display:flex; flex-direction:column; gap:8px; }
    .tryit-opt{ text-align:left; cursor:pointer; background:#fff; border:1.5px solid var(--rule,#EADFC6); border-radius:12px; padding:11px 13px; font:600 .98em -apple-system,system-ui,sans-serif; color:var(--ink); }
    .tryit-opt.correct{ border-color:#1F8F5E; background:#E7F6EE; color:#13603f; font-weight:800; }
    .tryit-opt.wrong{ border-color:#D9534F; background:#FBEAEA; color:#a3312d; }
    .tryit-fb{ margin-top:11px; padding:11px 13px; border-radius:12px; background:var(--m-soft,#E3ECF0); color:var(--ink-soft); font-size:.93em; line-height:1.5; }
    .tryit-fb.ok{ background:#E7F6EE; }
    .tryit-card{ padding:12px 0; border-bottom:1px solid var(--rule,#EADFC6); }
    .tryit-card:first-child{ padding-top:2px; }
    .tryit-card:last-child{ border-bottom:0; }
    .tryit-hint{ font-size:.9em; color:var(--ink-mute); font-style:italic; margin-bottom:10px; }
    .tryit-reveal-btn, .tryit-mem-btn{ cursor:pointer; border:0; border-radius:999px; padding:.55em 1.1em; font:800 .88em -apple-system,system-ui,sans-serif; color:#fff; background:linear-gradient(135deg,var(--m-color),var(--m-deep)); }
    .tryit-reveal{ margin-top:11px; padding:11px 13px; border-radius:12px; background:var(--m-soft,#E3ECF0); color:var(--ink-soft); line-height:1.55; }
    .tryit-mem-label{ font:800 .7rem -apple-system,system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--m-deep); margin-bottom:8px; }
    .tryit-mem-text{ font-size:1.08em; line-height:1.5; color:var(--ink); transition:filter .2s ease; }
    .tryit-mem-text.blurred{ filter:blur(7px); user-select:none; }
    .tryit-mem-src{ margin-top:8px; font-weight:700; color:var(--m-deep); font-size:.9em; }
    .tryit-mem-btn{ margin-top:11px; }
  </style>
</head>
<body class="method-page">
  <main id="root" class="op-main"></main>

  <script src="assets/arts-data.js"></script>
  <script src="assets/schools-data.js"></script>
  <script src="assets/tryit-data.js"></script>
  <script src="assets/reader.js"></script>
  <script src="assets/app.js"></script>
  <script>
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function initials(name){ return String(name).replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

    // A section drop-down: header with a count, a one-line teaser, and a body.
    function drop(opts){
      const count = (opts.count != null && opts.count !== '') ? `<span class="op-count">${esc(opts.count)}</span>` : '';
      const sub = opts.sub ? `<span class="op-sub">${esc(opts.sub)}</span>` : '';
      return `<details class="op-drop"${opts.open ? ' open' : ''}${opts.id ? ` id="${opts.id}"` : ''}>
          <summary><span class="op-sum-tt"><span class="op-sum-title">${esc(opts.title)}${count}</span>${sub}</span><span class="op-chev">›</span></summary>
          <div class="op-drop-body">${opts.body}</div>
        </details>`;
    }

    const id = new URLSearchParams(location.search).get('id') || 'foundation';
    const a = window.ART_BY_ID(id);
    const root = document.getElementById('root');

    if (a && window.TRYIT && window.TRYIT[id]) a.tryit = window.TRYIT[id];

    if (!a) {
      root.innerHTML = '<h1>Not found</h1><p><a href="index.html">← Home</a></p>';
    } else {
      document.title = 'Classical Mind — ' + a.name;
      const de = document.documentElement;
      de.style.setProperty('--m-color', a.color);
      de.style.setProperty('--m-deep', a.colorDeep);
      de.style.setProperty('--m-soft', a.colorSoft);
      const mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', a.colorDeep);
      render(a);
    }

    function render(a){
      const S = a.sections || {};
      const whatItIs = S['what-it-is'], path = S['the-path'], practice = S['practice'], reading = S['reading'], masters = S['masters'];

      // ---- At a glance (open) ----
      let glance = a.glance;
      if (!glance || !glance.length) {
        glance = [{ k: 'Tradition', v: a.group }];
        if (a.short) glance.push({ k: 'In a phrase', v: a.short });
      }
      const glanceHtml = `
        <div class="op-glance ${glance.length === 1 ? 'one' : ''}">
          ${glance.map((g, i) => `<div class="op-gcard op-outline ${g.wide || (glance.length % 2 === 1 && i === glance.length - 1) ? 'wide' : ''}">
              <div class="op-gk">${esc(g.k)}</div><div class="op-gv">${esc(g.v)}</div>
            </div>`).join('')}
        </div>`;

      // ---- Core ideas (open drop-down — you land on substance) ----
      const ideasHtml = whatItIs ? drop({
        id: 'what-it-is', open: true, title: 'The core ideas', count: whatItIs.principles.length,
        sub: 'The heart of it — read these',
        body: `${whatItIs.intro ? `<p class="op-intro">${esc(whatItIs.intro)}</p>` : ''}
          ${whatItIs.principles.map((p, i) => `
            <div class="op-idea">
              <div class="op-idea-top"><div class="op-idx">${i + 1}</div><h3>${esc(p.name)}</h3></div>
              <p>${esc(p.body)}</p>
              ${p.why ? `<div class="op-why"><b>Why it matters</b>${esc(p.why)}</div>` : ''}
            </div>`).join('')}`
      }) : '';

      // ---- The bigger picture (a.worldview) — the philosophy's own cosmos/metaphysics,
      //      presented on its own terms, never framed against. {title?, sub?, body:str|str[]} ----
      const worldviewHtml = a.worldview ? drop({
        id: 'worldview',
        title: a.worldview.title || 'The bigger picture',
        sub: a.worldview.sub || 'How this philosophy sees the whole',
        body: `<div class="op-world">${(Array.isArray(a.worldview.body) ? a.worldview.body : String(a.worldview.body).split('\n\n')).map(x => `<p>${esc(x)}</p>`).join('')}</div>`
      }) : '';

      // ---- Remember it by (visible highlight) ----
      const rememberHtml = a.remember ? `
        <div class="op-remember">
          <div class="op-rk">Remember it by</div>
          ${(Array.isArray(a.remember) ? a.remember : [a.remember]).map(x => `<p>${x}</p>`).join('')}
        </div>` : '';

      // ---- Key figures (collapsed) ----
      const figuresHtml = masters ? drop({
        id: 'masters', title: 'The key figures', count: masters.figures.length,
        sub: masters.intro ? masters.intro.replace(/\s+/g, ' ').slice(0, 78).trim() + '…' : 'Who carried it',
        body: `${masters.intro ? `<p class="op-intro">${esc(masters.intro)}</p>` : ''}
          ${masters.figures.map(f => `
            <div class="op-fig">
              <div class="op-fig-av">${f.image ? `<img src="${esc(f.image)}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(initials(f.name))}'))">` : esc(initials(f.name))}</div>
              <div class="op-fig-tt"><div class="op-fig-name">${esc(f.name)}</div><div class="op-fig-what">${esc(f.what)}</div></div>
            </div>`).join('')}`
      }) : '';

      // ---- The path (collapsed) ----
      const pathHtml = path ? drop({
        id: 'the-path', title: 'The path', count: (path.levels && path.levels.length) ? path.levels.length + ' stages' : '',
        sub: 'Beginner → intermediate → advanced',
        body: `${path.intro ? `<p class="op-intro">${esc(path.intro)}</p>` : ''}
          ${path.levels.map(l => `<div class="op-stage"><h4>${esc(l.stage)}</h4><ul>${l.items.map(it => `<li>${esc(it)}</li>`).join('')}</ul></div>`).join('')}`
      }) : '';

      // ---- Practices (collapsed) ----
      const practiceHtml = practice ? drop({
        id: 'practice', title: 'Practices to try', count: practice.items.length,
        sub: 'Concrete exercises you can begin today',
        body: `${practice.intro ? `<p class="op-intro">${esc(practice.intro)}</p>` : ''}
          ${practice.items.map(it => `<div class="op-prac"><div class="op-prac-name">${esc(it.name)}</div><div class="op-prac-body">${esc(it.body)}</div></div>`).join('')}`
      }) : '';

      // ---- FAQ (small nested accordions under a label) ----
      const faqHtml = (a.faq && a.faq.length) ? `
        <div class="op-label">Common questions</div>
        ${a.faq.map(f => `
          <details class="op-drop op-faq">
            <summary><span class="op-sum-tt"><span class="op-sum-title">${esc(f.q)}</span></span><span class="op-chev">›</span></summary>
            <div class="op-drop-body"><p class="op-prac-body" style="font-size:1em">${esc(f.a)}</p></div>
          </details>`).join('')}` : '';

      // ---- Reading (collapsed) ----
      const readingHtml = reading ? drop({
        id: 'reading', title: 'What to read', count: (reading.books && reading.books.length) ? reading.books.length + ' books' : '',
        sub: 'Primary sources first, then the on-ramps',
        body: `${reading.intro ? `<p class="op-intro">${esc(reading.intro)}</p>` : ''}
          ${reading.books.map(b => {
            const note = b.note || '';
            const m = note.match(/^(PRIMARY[\w-]*|ON-RAMP|PRIMARY-adjacent)\b[.,:]?\s*/i);
            let tag = '', rest = note;
            if (m) {
              const isRamp = /on-ramp/i.test(m[1]);
              tag = `<span class="op-tag ${isRamp ? 'onramp' : 'primary'}">${isRamp ? 'On-ramp' : 'Primary'}</span>`;
              rest = note.slice(m[0].length);
            }
            return `<div class="op-book"><div class="op-book-title">${esc(b.title)}</div><div class="op-book-author">${esc(b.author)}</div><div class="op-book-note">${tag}${esc(rest)}</div></div>`;
          }).join('')}`
      }) : '';

      // ---- Test yourself (collapsed, interactive) ----
      const tryitHtml = a.tryit ? drop({
        id: 'tryit-drop', title: 'Test yourself', count: (a.tryit.exercises && a.tryit.exercises.length) || '',
        sub: 'A few exercises to see what stuck',
        body: `<div id="tryit-body"></div>`
      }) : '';

      root.innerHTML = `
        <header class="op-hero op-outline">
          ${a.image ? `<img class="op-hero-img" src="${esc(a.image)}" alt="" onerror="this.remove()">` : ''}
          <div class="op-hero-txt">
            <div class="op-eyebrow">${esc(a.group)}</div>
            <h1>${esc(a.name)}</h1>
            ${a.tagline ? `<div class="op-tagline">${esc(a.tagline)}</div>` : ''}
          </div>
        </header>

        ${a.blurb ? `<p class="op-gist">${esc(a.blurb)}</p>` : ''}
        ${glanceHtml}
        ${ideasHtml}
        ${worldviewHtml}
        ${rememberHtml}
        ${figuresHtml}
        ${pathHtml}
        ${practiceHtml}
        ${faqHtml}
        ${readingHtml}
        ${tryitHtml}

        <div class="op-actions">
          <button class="op-read" id="op-read-btn">▶ Read this aloud</button>
          <a class="op-back" href="index.html">← All of Classical Mind</a>
        </div>
      `;

      // Read aloud
      const rb = document.getElementById('op-read-btn');
      if (rb) rb.addEventListener('click', () => {
        if (window.Reader && window.Reader.speaking) { window.Reader.stop(); rb.textContent = '▶ Read this aloud'; }
        else if (window.Reader) { window.Reader.readElement(root); rb.textContent = '⏹ Stop'; }
      });

      // Interactive tryit, mounted into its drop-down
      if (a.tryit) mountTryIt(a.tryit);

      // Deep-link: ?s=KEY opens that section and scrolls to it
      const sub = new URLSearchParams(location.search).get('s');
      if (sub) {
        const target = document.getElementById(sub);
        if (target) {
          if (target.tagName === 'DETAILS') target.open = true;
          setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
        }
      }
    }

    // ---- tryit rendering + wiring (reused, mounted inline) ----
    function mountTryIt(s){
      const host = document.getElementById('tryit-body');
      if (!host) return;
      const cards = s.exercises.map((ex, i) => {
        if (ex.type === 'choice') {
          const opts = ex.options.map((o, j) => `<button class="tryit-opt" data-i="${j}">${esc(o)}</button>`).join('');
          return `<div class="tryit-card" data-ex="${i}" data-answer="${ex.answer}"><div class="tryit-q">${esc(ex.q)}</div><div class="tryit-opts">${opts}</div><div class="tryit-fb" hidden></div></div>`;
        }
        if (ex.type === 'reveal') {
          return `<div class="tryit-card"><div class="tryit-q">${esc(ex.q)}</div>${ex.hint ? `<div class="tryit-hint">${esc(ex.hint)}</div>` : ''}<button class="tryit-reveal-btn" data-ex="${i}">Show a model answer</button><div class="tryit-reveal" id="rev-${i}" hidden>${esc(ex.reveal)}</div></div>`;
        }
        if (ex.type === 'memorise') {
          return `<div class="tryit-card"><div class="tryit-mem-label">Learn this by heart</div><div class="tryit-mem-text" id="mem-${i}">${esc(ex.text)}</div><div class="tryit-mem-src">— ${esc(ex.source)}</div><button class="tryit-mem-btn" data-ex="${i}">Hide &amp; recall</button></div>`;
        }
        return '';
      }).join('');
      host.innerHTML = `${s.intro ? `<p class="op-intro">${esc(s.intro)}</p>` : ''}${cards}`;
      host.addEventListener('click', (e) => {
        const opt = e.target.closest('.tryit-opt');
        if (opt) {
          const card = opt.closest('.tryit-card');
          if (card.dataset.done) return;
          card.dataset.done = '1';
          const answer = +card.dataset.answer, chosen = +opt.dataset.i, ex = s.exercises[+card.dataset.ex];
          [...card.querySelectorAll('.tryit-opt')].forEach((b, j) => { b.disabled = true; if (j === answer) b.classList.add('correct'); else if (j === chosen) b.classList.add('wrong'); });
          const fb = card.querySelector('.tryit-fb'); fb.hidden = false; fb.classList.toggle('ok', chosen === answer);
          fb.innerHTML = `<b>${chosen === answer ? '✓ Correct.' : '✗ Not quite.'}</b> ${esc(ex.explain)}`;
          return;
        }
        const rev = e.target.closest('.tryit-reveal-btn');
        if (rev) { const r = host.querySelector('#rev-' + rev.dataset.ex); if (r) r.hidden = false; rev.hidden = true; return; }
        const mem = e.target.closest('.tryit-mem-btn');
        if (mem) { const t = host.querySelector('#mem-' + mem.dataset.ex); const hidden = t.classList.toggle('blurred'); mem.textContent = hidden ? 'Reveal' : 'Hide & recall'; }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
