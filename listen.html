<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#33468C">
  <title>The Reading Room — Classical Mind</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body{ --c:#4C63B6; --cd:#33468C; }
    .listen-main{ max-width:720px; margin:0 auto; padding:4em 1.2em calc(120px + env(safe-area-inset-bottom)); }
    .listen-hero{ margin:0 0 22px; }
    .listen-hero .lh-eyebrow{ font:800 12px/1 var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--cd); margin-bottom:10px; }
    .listen-hero h1{ font-weight:800; font-size:clamp(26px,6.5vw,34px); letter-spacing:-.03em; line-height:1.05; margin:0; color:var(--ink); }
    .listen-hero p{ margin:.55em 0 0; font-size:15.5px; line-height:1.5; color:var(--ink-soft); max-width:52ch; }
    .listen-playall{ margin-top:16px; display:inline-flex; align-items:center; gap:9px; border:0; cursor:pointer; color:#fff; font:800 15px var(--sans); background:linear-gradient(135deg,var(--c),var(--cd)); padding:.75em 1.4em; border-radius:999px; box-shadow:0 4px 14px rgba(51,70,140,.32); transition:transform .15s ease; }
    .listen-playall:active{ transform:scale(.97); }
    .listen-shuffle{ margin:16px 0 0 10px; display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--rule); cursor:pointer; color:var(--cd); background:#fff; font:800 15px var(--sans); padding:.72em 1.25em; border-radius:999px; box-shadow:var(--shadow-sm); transition:transform .15s ease; }
    .listen-shuffle:active{ transform:scale(.97); }

    .listen-list{ display:flex; flex-direction:column; gap:.55em; }
    .rd{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer; background:#fff; border:1.5px solid var(--rule); border-radius:15px; padding:12px 14px; box-shadow:var(--shadow-sm); transition:border-color .15s ease, transform .1s ease; }
    .rd:active{ transform:scale(.995); }
    .rd.active{ border-color:var(--c); box-shadow:0 4px 14px rgba(51,70,140,.18); }
    .rd-ic{ flex:none; width:40px; height:40px; border-radius:11px; display:grid; place-items:center; color:#fff; font-size:15px; background:linear-gradient(150deg,var(--c),var(--cd)); }
    .rd.active .rd-ic{ background:linear-gradient(150deg,#1F8F5E,#166B46); }
    .rd-body{ flex:1; min-width:0; }
    .rd-title{ font-weight:800; font-size:1.02em; color:var(--ink); line-height:1.2; }
    .rd-src{ font-size:.85em; color:var(--ink-mute); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rd-num{ flex:none; font:800 .82em var(--sans); color:var(--ink-mute); opacity:.6; }

    /* Buttons on this page: neutralise the global gradient-ring/padding so the
       round transport controls render as clean, aligned circles. */
    .listen-playall::before, .listen-shuffle::before, .player button::before{ display:none !important; }
    .player button{ padding:0; border:0; background:none; }

    /* Sticky player — three tidy rows: meta + loop, seek, centred transport */
    .player{ position:fixed; left:0; right:0; bottom:0; z-index:60; background:rgba(255,255,255,.98); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1.5px solid var(--rule); box-shadow:0 -6px 24px rgba(40,30,15,.12); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .pl-inner{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:11px; }
    .pl-top{ display:flex; align-items:center; gap:12px; }
    .pl-meta{ flex:1; min-width:0; }
    .pl-title{ font-weight:800; font-size:1em; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2; }
    .pl-src{ font-size:.82em; color:var(--ink-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
    .pl-seek{ -webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:3px; background:var(--cs); cursor:pointer; }
    .pl-seek::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--c); box-shadow:0 1px 3px rgba(0,0,0,.3); }
    .pl-transport{ display:flex; align-items:center; justify-content:center; gap:28px; }
    .pl-icon{ flex:none; width:46px; height:46px; border-radius:50%; cursor:pointer; color:var(--cd); display:inline-flex; align-items:center; justify-content:center; background:var(--cs); transition:transform .12s ease; }
    .pl-icon svg{ width:22px; height:22px; }
    .pl-play{ flex:none; width:58px; height:58px; border-radius:50%; cursor:pointer; color:#fff; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--c),var(--cd)); box-shadow:0 6px 18px rgba(51,70,140,.42); transition:transform .12s ease; }
    .pl-play svg{ width:26px; height:26px; }
    .pl-icon:active, .pl-play:active{ transform:scale(.92); }
    .pl-top .pl-loop{ width:40px; height:40px; }
    .pl-top .pl-loop svg{ width:19px; height:19px; }
    .pl-loop.on{ background:linear-gradient(135deg,var(--c),var(--cd)); color:#fff; }
  </style>
</head>
<body class="method-page">
  <main class="listen-main">
    <header class="listen-hero">
      <div class="lh-eyebrow">The Reading Room</div>
      <h1>Press play. Be inspired.</h1>
      <p>Short, powerful passages from the classical world, read aloud — for the odd few minutes here and there, while you go about your day. They loop, so hear them as often as you like.</p>
      <button class="listen-playall" id="playAll"><span aria-hidden="true">▶</span> Play all</button>
      <button class="listen-shuffle" id="shuffle"><span aria-hidden="true">🔀</span> Shuffle</button>
    </header>
    <div class="listen-list" id="list"></div>
  </main>

  <div class="player" id="playerBar" hidden>
    <div class="pl-inner">
      <div class="pl-top">
        <div class="pl-meta">
          <div class="pl-title" id="plTitle">—</div>
          <div class="pl-src" id="plSrc"></div>
        </div>
        <button class="pl-icon pl-loop on" id="plLoop" aria-label="Loop the whole set" title="Loop the whole set">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <input type="range" class="pl-seek" id="plSeek" min="0" max="1000" value="0" aria-label="Seek">
      <div class="pl-transport">
        <button class="pl-icon" id="plPrev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="6" width="3" height="12" rx="1"/><path d="M20 6v12L9 12z"/></svg>
        </button>
        <button class="pl-play" id="plPlay" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>
        </button>
        <button class="pl-icon" id="plNext" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="16" y="6" width="3" height="12" rx="1"/><path d="M4 6l11 6L4 18z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <audio id="player" preload="none"></audio>

  <script src="assets/readings-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const R = window.READINGS || [];
    const listEl = document.getElementById('list');
    const audio = document.getElementById('player');
    const bar = document.getElementById('playerBar');
    const el = id => document.getElementById(id);
    let cur = -1, loopAll = true, shuffle = false;
    const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>';
    const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    listEl.innerHTML = R.map((r, i) => `
      <button class="rd" data-i="${i}">
        <span class="rd-ic" data-ic>▶</span>
        <span class="rd-body"><span class="rd-title">${esc(r.title)}</span><span class="rd-src">${esc(r.source)}</span></span>
        <span class="rd-num">${i + 1}</span>
      </button>`).join('');

    function markActive(){
      [...listEl.querySelectorAll('.rd')].forEach((b, i) => {
        const on = i === cur;
        b.classList.toggle('active', on);
        b.querySelector('[data-ic]').textContent = (on && !audio.paused) ? '❚❚' : '▶';
      });
    }

    function load(i, autoplay){
      if (i < 0 || i >= R.length) return;
      cur = i;
      audio.src = 'assets/readings/' + R[i].id + '.mp3';
      el('plTitle').textContent = R[i].title;
      el('plSrc').textContent = R[i].source;
      bar.hidden = false;
      document.querySelector('.listen-main').style.paddingBottom = '128px';
      if (autoplay !== false) audio.play().catch(() => {});
      markActive();
    }
    function next(){
      if (shuffle && R.length > 1) { let n; do { n = Math.floor(Math.random() * R.length); } while (n === cur); return load(n); }
      if (cur + 1 < R.length) load(cur + 1); else if (loopAll) load(0); else { audio.pause(); markActive(); }
    }
    function prev(){ if (audio.currentTime > 3) { audio.currentTime = 0; } else load(Math.max(0, cur - 1)); }

    listEl.addEventListener('click', e => {
      const b = e.target.closest('.rd'); if (!b) return;
      const i = +b.dataset.i;
      if (i === cur) { audio.paused ? audio.play() : audio.pause(); }
      else load(i);
    });
    el('playAll').addEventListener('click', () => { shuffle = false; if (cur === -1) load(0); else audio.play(); });
    el('shuffle').addEventListener('click', () => { shuffle = true; load(Math.floor(Math.random() * R.length)); });
    el('plPlay').addEventListener('click', () => { if (cur === -1) load(0); else (audio.paused ? audio.play() : audio.pause()); });
    el('plNext').addEventListener('click', next);
    el('plPrev').addEventListener('click', prev);
    el('plLoop').addEventListener('click', () => { loopAll = !loopAll; el('plLoop').classList.toggle('on', loopAll); });

    audio.addEventListener('play', () => { el('plPlay').innerHTML = PAUSE_SVG; markActive(); });
    audio.addEventListener('pause', () => { el('plPlay').innerHTML = PLAY_SVG; markActive(); });
    audio.addEventListener('ended', next);
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) el('plSeek').value = Math.round((audio.currentTime / audio.duration) * 1000);
    });
    el('plSeek').addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (el('plSeek').value / 1000) * audio.duration;
    });
    audio.addEventListener('error', () => { el('plSrc').textContent = R[cur] ? R[cur].source + ' · audio unavailable' : ''; });
  </script>
</body>
</html>
