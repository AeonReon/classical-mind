<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Classical Mind">
  <meta name="theme-color" content="#FAF6EC">
  <title>Classical Mind — A random practice</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css?v68">
  <!-- Theme, applied before first paint so a dark-mode load never flashes
       white. The choice lives in localStorage and is set ONLY by the logo
       toggle in the top-left of the home page.

       The status strip is handled DIFFERENTLY per theme, and it has to be:

       - DARK: black-translucent. The web view runs under the clock and the
         page paints the band itself from var(--chrome). iOS draws the clock
         white, which is right on a near-black strip.
       - LIGHT: `default`. iOS draws the strip and, crucially, draws the clock
         BLACK — which is the only way to get a cream strip you can still read
         the time on. Under black-translucent the clock is white with no light
         variant, so cream would make it vanish. That is why light mode was
         blue until now.

       The meta in the HTML stays black-translucent, so if iOS ever ignores
       this script the DARK strip still works and light mode simply keeps the
       blue band it has today. It cannot regress. And when `default` is in
       force, env(safe-area-inset-top) is 0, so the painted band collapses to
       no height on its own — the two mechanisms can never both be visible. -->
  <script>
    (function () {
      var d = document.documentElement, dark = false;
      try { dark = localStorage.getItem('classicalmind.theme') === 'dark'; } catch (e) {}
      d.setAttribute('data-theme', dark ? 'dark' : 'light');

      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', dark ? '#17141F' : '#FAF6EC');

      var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (sb && !dark) sb.setAttribute('content', 'default');
    })();
  </script>
</head>
<body class="random-page">
  <a href="index.html" class="home-link">← Home</a>

  <main class="random-main">
    <header class="random-hero">
      <div class="random-eyebrow">Surprise me</div>
      <h1>A random practice</h1>
      <p class="lede">One small thing to try today, drawn at random from any of the liberal arts. Press the button for another.</p>
    </header>

    <div id="card-host"></div>

    <div class="random-actions">
      <button id="another-btn" class="primary-fill">↻ Another practice</button>
    </div>
  </main>

  <script src="assets/arts-data.js"></script>
  <script src="assets/schools-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    function pick() {
      const withPractice = window.ARTS.filter(a => a.sections && a.sections.practice && a.sections.practice.items && a.sections.practice.items.length);
      const a = withPractice[Math.floor(Math.random() * withPractice.length)];
      const items = a.sections.practice.items;
      const item = items[Math.floor(Math.random() * items.length)];
      return { a, item };
    }

    function render() {
      const { a, item } = pick();
      document.documentElement.style.setProperty('--m-color', a.color);
      document.documentElement.style.setProperty('--m-deep', a.colorDeep);
      document.documentElement.style.setProperty('--m-soft', a.colorSoft);
      // The status-bar colour is owned by the boot script in <head> and holds
      // two values only, light and dark. Pages used to repaint it with the
      // topic's own accent here, which is why the strip was a different
      // colour on every page and never followed the theme.

      document.getElementById('card-host').innerHTML = `
        <div class="random-card" style="--c:${a.color};--cd:${a.colorDeep};--cs:${a.colorSoft};">
          <div class="random-card-eyebrow">From ${a.name}</div>
          <h2 class="random-card-name">${item.name}</h2>
          <p class="random-card-body">${item.body}</p>
          <a class="random-card-link" href="art.html?id=${a.id}">Explore ${a.name} →</a>
        </div>
      `;
    }

    document.getElementById('another-btn').addEventListener('click', render);
    render();
  </script>
</body>
</html>
