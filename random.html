<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EC">
  <title>Classical Mind — A random practice</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css?v63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default" — the same as Days Out NI, which follows the theme correctly on
       this phone. iOS owns an opaque status bar and paints it from the live
       <meta name="theme-color">, which theme.js keeps in step. An earlier build
       used "black-translucent" so the page could paint that band itself; the
       device reported safe-area-inset-top as 0px, proving the web view never
       ran under the clock and the band was never the page's to paint. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    /* Before first paint: set the theme and the chrome colour, so the bar is
       right on the very first frame rather than flicking after load. */
    (function () {
      var CHROME = { light: '#3F8FCB', dark: '#12252F' }, t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', CHROME[t]);
    })();
  </script>
</head>
<body class="random-page">
  <a href="index.html" class="home-link">← Home</a>

  <main class="random-main">
    <header class="random-hero">
      <div class="random-eyebrow">Surprise me</div>
      <h1>A random practice</h1>
      <p class="lede">One small thing to try today, drawn at random from any of the liberal arts. Press the button for another.</p>
    </header>

    <div id="card-host"></div>

    <div class="random-actions">
      <button id="another-btn" class="primary-fill">↻ Another practice</button>
    </div>
  </main>

  <script src="assets/arts-data.js"></script>
  <script src="assets/schools-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    function pick() {
      const withPractice = window.ARTS.filter(a => a.sections && a.sections.practice && a.sections.practice.items && a.sections.practice.items.length);
      const a = withPractice[Math.floor(Math.random() * withPractice.length)];
      const items = a.sections.practice.items;
      const item = items[Math.floor(Math.random() * items.length)];
      return { a, item };
    }

    function render() {
      const { a, item } = pick();
      document.documentElement.style.setProperty('--m-color', a.color);
      document.documentElement.style.setProperty('--m-deep', a.colorDeep);
      document.documentElement.style.setProperty('--m-soft', a.colorSoft);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', a.color);

      document.getElementById('card-host').innerHTML = `
        <div class="random-card" style="--c:${a.color};--cd:${a.colorDeep};--cs:${a.colorSoft};">
          <div class="random-card-eyebrow">From ${a.name}</div>
          <h2 class="random-card-name">${item.name}</h2>
          <p class="random-card-body">${item.body}</p>
          <a class="random-card-link" href="art.html?id=${a.id}">Explore ${a.name} →</a>
        </div>
      `;
    }

    document.getElementById('another-btn').addEventListener('click', render);
    render();
  </script>
  <script src="assets/theme.js?v63"></script>
</body>
</html>
